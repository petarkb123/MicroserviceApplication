server.port=1010
spring.application.name=analytics-microservice

spring.datasource.url=jdbc:mysql://localhost:3306/fitness_analytics_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci
# Database credentials - REQUIRED FOR LOCAL DEVELOPMENT
# Option 1: Create application-local.properties file in this directory with:
#   spring.datasource.username=your_mysql_username
#   spring.datasource.password=your_mysql_password
# Option 2: Set environment variables: DB_USERNAME and DB_PASSWORD
# Option 3: Replace the values below directly (not recommended for production)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

logging.level.project.fitnessanalytics=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

