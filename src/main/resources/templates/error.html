<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Service - Error <span th:text="${status}">500</span></title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon-wrapper">
                <div class="error-icon" th:text="${status == 404 ? '🔍' : (status == 403 ? '🔒' : (status == 400 ? '⚠️' : '❌'))}">❌</div>
            </div>
            
            <h1 class="error-code" th:text="${status}">500</h1>
            <h2 class="error-title" th:text="${error}">Error</h2>
            <p class="error-message" th:text="${message}">An error occurred</p>
            
            <div th:if="${status == 404}" class="helpful-text">
                The resource you're looking for doesn't exist.
            </div>
            <div th:if="${status == 403}" class="helpful-text">
                You don't have permission to access this resource.
            </div>
            <div th:if="${status == 400}" class="helpful-text">
                Please check your input and try again.
            </div>
            <div th:if="${status == 500}" class="helpful-text">
                An internal server error occurred. Please try again later.
            </div>
            
            <div th:if="${errors != null and !errors.isEmpty()}" class="validation-errors">
                <h3>Validation Errors</h3>
                <ul>
                    <li th:each="error : ${errors}">
                        <strong th:text="${error.key}">field</strong>: 
                        <span th:text="${error.value}">error message</span>
                    </li>
                </ul>
            </div>
            
            <div class="error-actions">
                <button onclick="history.back()" class="btn btn-primary">Go Back</button>
            </div>
        </div>
    </div>
</body>
</html>
